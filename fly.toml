# Fly.io config for the background job worker (docs/architecture.md §8, §13).
# Runs `npm run worker` — the 30s job poll loop. It exposes NO HTTP service, so there is
# no [http_service] block: the machine runs continuously and is never idled/stopped (a
# worker has no inbound traffic to wake it).
#
# `app` must be globally unique across Fly; `fly launch` will adjust it if this name is taken.
app = "project-x-worker"
primary_region = "lhr"  # London — nearest Fly region to the Neon database (eu-west-2)

[build]
  dockerfile = "Dockerfile.worker"

[processes]
  worker = "npm run worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]
